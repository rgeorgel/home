<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-72TQVP3Q7X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-72TQVP3Q7X');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project · Ricardo Georgel</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="i18n.js?v=2"></script>
  <script src="projects/data.js"></script>
  <script src="projects/data.pt.js"></script>
  <script src="projects/data.es.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f3f2ee;
      --ink: #0b0b0c;
      --muted: #77756f;
      --line: rgba(11,11,12,.14);
      --accent: #7a3cff;
      --on-accent: #fff;
      --display: 'Archivo Black', 'Arial Black', sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --pad: clamp(1.2rem, 4vw, 3rem);
      --ease: cubic-bezier(.7,0,.2,1);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.4rem var(--pad);
      mix-blend-mode: difference;
      color: #fff;
      font-size: .8rem; font-weight: 500; letter-spacing: .02em;
    }
    nav .mark { font-family: var(--display); font-size: 1.05rem; letter-spacing: -.02em; }
    nav ul { display: flex; gap: 1.6rem; list-style: none; }
    nav ul a { position: relative; padding: .2rem 0; }
    nav ul a::after {
      content: ''; position: absolute; left: 0; bottom: 0;
      width: 100%; height: 1px; background: currentColor;
      transform: scaleX(0); transform-origin: right;
      transition: transform .4s var(--ease);
    }
    nav ul a:hover::after { transform: scaleX(1); transform-origin: left; }
    nav .langs { display: flex; gap: .55rem; padding-left: 1.6rem; border-left: 1px solid currentColor; }
    nav .langs a { opacity: .45; transition: opacity .3s; padding: 0; }
    nav .langs a:hover, nav .langs a[aria-current] { opacity: 1; }
    nav .langs a:not([aria-current])::after { display: none; }

    .label {
      font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted);
      display: flex; align-items: center; gap: .6rem;
    }
    .label::before { content: ''; width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); }

    /* ── Intro ── */
    .intro {
      padding: clamp(7rem, 16vw, 11rem) var(--pad) clamp(2.5rem, 6vw, 4.5rem);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: clamp(1.5rem, 4vw, 3rem) 2rem;
      align-items: end;
    }
    .intro .label { grid-column: 1 / -1; }
    .intro h1 {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(3rem, 12vw, 11rem);
      line-height: .9; letter-spacing: -.05em;
      grid-column: 1 / -1;
    }
    .intro h1 span { display: inline-block; }
    .tile {
      width: clamp(84px, 11vw, 150px); aspect-ratio: 1;
      border-radius: 28%;
      display: grid; place-items: center;
      font-size: clamp(42px, 5.5vw, 76px);
      background: var(--accent);
      box-shadow: 0 30px 60px -24px rgba(0,0,0,.45);
      grid-row: 2; grid-column: 2; justify-self: end; align-self: start;
      rotate: -8deg;
      transition: rotate .6s cubic-bezier(.2,1.4,.3,1);
    }
    .tile:hover { rotate: 6deg; }
    .tagline {
      font-size: clamp(1.05rem, 1.8vw, 1.5rem);
      line-height: 1.4; max-width: 34em;
    }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.4rem; }

    .btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; gap: .7rem;
      padding: 1.05rem 1.6rem;
      border-radius: 999px;
      background: var(--ink); color: var(--paper);
      font-weight: 600; font-size: .95rem;
      isolation: isolate;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: var(--accent);
      transform: translateY(101%);
      transition: transform .5s var(--ease);
    }
    .btn:hover { color: var(--on-accent); }
    .btn:hover::before { transform: none; }
    .btn .arr { transition: transform .5s var(--ease); }
    .btn:hover .arr { transform: translate(3px,-3px); }
    .host { font-size: .85rem; color: var(--muted); }

    /* ── Gallery ── */
    .gallery {
      padding: 0 var(--pad) clamp(4rem, 9vw, 7rem);
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: clamp(.8rem, 2vw, 1.6rem);
    }
    .shot {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1px 0 var(--line), 0 40px 80px -40px rgba(11,11,12,.35);
      cursor: zoom-in;
      border: 1px solid var(--line);
    }
    .shot.wide { grid-column: 1 / -1; }
    .shot .bar {
      display: flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }
    .shot .bar i { width: 10px; height: 10px; border-radius: 50%; background: #dcdad3; }
    .shot .bar span {
      margin-left: 12px; font-size: .72rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .shot img { width: 100%; height: auto; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
    .shot:hover img { transform: scale(1.015); }
    .shot.phone {
      border-radius: 28px; border: 8px solid var(--ink);
      background: var(--ink);
      min-height: 200px;
    }
    .shot:not(.phone) { align-self: start; }
    .shot.phone img {
      position: absolute; inset: 0; height: 100%;
      object-fit: cover; object-position: top;
      border-radius: 20px;
    }
    .shot.reveal { opacity: 0; transform: translateY(40px); transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); }
    .shot.reveal.in { opacity: 1; transform: none; }

    /* ── About ── */
    .about {
      border-top: 1px solid var(--line);
      padding: clamp(4rem, 9vw, 7rem) var(--pad);
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: clamp(2.5rem, 6vw, 6rem);
    }
    .about .label { margin-bottom: 2rem; }
    .desc p {
      font-size: clamp(1.15rem, 1.9vw, 1.65rem);
      line-height: 1.45; letter-spacing: -.01em;
      max-width: 32em;
    }
    .desc p + p { margin-top: 1.2em; color: #3a3935; }
    .facts { display: grid; gap: 0; margin-bottom: 3rem; }
    .facts div {
      display: flex; justify-content: space-between; gap: 1rem;
      padding: .9rem 0; border-top: 1px solid var(--line);
      font-size: .9rem;
    }
    .facts div:last-child { border-bottom: 1px solid var(--line); }
    .facts dt { color: var(--muted); }
    .facts dd { font-weight: 600; text-align: right; }
    .features { list-style: none; display: grid; gap: .85rem; }
    .features li {
      display: grid; grid-template-columns: 1.2rem 1fr; gap: .6rem;
      font-size: .98rem; line-height: 1.45;
    }
    .features li::before {
      content: ''; width: 8px; height: 8px; margin-top: .45em;
      background: var(--accent); transform: rotate(45deg);
    }

    /* ── Next project ── */
    .next {
      position: relative; display: block; overflow: hidden;
      border-top: 1px solid var(--line);
      padding: clamp(3rem, 8vw, 6rem) var(--pad);
      isolation: isolate;
    }
    .next::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: var(--next, var(--ink));
      transform: translateY(101%);
      transition: transform .6s var(--ease);
    }
    .next .label { margin-bottom: 1.2rem; transition: color .4s; }
    .next .label::before { background: var(--next, var(--ink)); transition: background .4s; }
    .next strong {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      font-family: var(--display); font-weight: 400;
      font-size: clamp(2.4rem, 9vw, 8rem);
      line-height: .95; letter-spacing: -.05em;
      transition: transform .6s var(--ease), color .4s;
    }
    .next strong em { font-style: normal; transition: transform .6s var(--ease); }
    @media (hover: hover) {
      .next:hover { color: var(--next-on, #fff); }
      .next:hover::before { transform: none; }
      .next:hover .label { color: inherit; }
      .next:hover .label::before { background: currentColor; }
      .next:hover strong { transform: translateX(1.2rem); }
      .next:hover strong em { transform: translateX(-1.2rem) rotate(-8deg); }
    }

    /* ── Footer ── */
    footer {
      background: var(--ink); color: #8d8a83;
      padding: 2rem var(--pad);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
      font-size: .75rem;
    }
    footer nav { all: unset; display: flex; gap: 1.4rem; }
    footer a:hover { color: var(--paper); }

    /* ── Lightbox ── */
    .lb {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(11,11,12,.92);
      display: grid; place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      cursor: zoom-out;
    }
    .lb.on { opacity: 1; pointer-events: auto; }
    .lb img {
      max-width: min(100%, calc(100vw - 8rem)); max-height: calc(100svh - 7rem);
      width: auto; height: auto;
      border-radius: 10px;
      box-shadow: 0 40px 100px rgba(0,0,0,.5);
      scale: .96; transition: scale .4s cubic-bezier(.2,.8,.2,1);
    }
    .lb.on img { scale: 1; }
    .lb button {
      position: absolute; top: 50%; translate: 0 -50%;
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06);
      color: #fff; font-size: 1.3rem; cursor: pointer;
    }
    .lb button:hover { background: rgba(255,255,255,.16); }
    .lb .prev { left: clamp(.6rem, 2vw, 1.6rem); }
    .lb .next-shot { right: clamp(.6rem, 2vw, 1.6rem); }
    .lb .close { top: 1.6rem; right: clamp(.6rem, 2vw, 1.6rem); translate: none; }
    .lb .count { position: absolute; bottom: 1.4rem; left: 0; right: 0; text-align: center; color: #8d8a83; font-size: .75rem; letter-spacing: .14em; }

    .fade-up { opacity: 0; transform: translateY(18px); animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }

    @media (max-width: 720px) {
      .intro { grid-template-columns: 1fr; }
      .tile { grid-row: auto; grid-column: 1; justify-self: start; order: -1; }
      .gallery { grid-template-columns: 1fr; }
      .shot.phone { min-height: 0; width: min(280px, 80%); justify-self: center; }
      .shot.phone img { position: static; height: auto; }
      .about { grid-template-columns: 1fr; }
      nav ul { gap: 1.1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-up, .shot.reveal { animation: none; opacity: 1; transform: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="mark" href="index.html">RG</a>
    <ul>
      <li><a href="index.html#work" data-i18n="nav.allWork">← All work</a></li>
      <li><a href="index.html#contact" data-i18n="nav.contact">Contact</a></li>
      <li class="langs" id="langs"></li>
    </ul>
  </nav>

  <main id="app">
    <header class="intro">
      <div class="label fade-up" id="kicker"></div>
      <h1 class="fade-up d1" id="name"></h1>
      <div class="fade-up d2">
        <p class="tagline" id="tagline"></p>
        <div class="actions" style="margin-top:1.8rem">
          <a class="btn" id="visit" target="_blank" rel="noopener"><span id="visit-label"></span><span class="arr">↗</span></a>
          <span class="host" id="host"></span>
        </div>
      </div>
      <div class="tile fade-up d3" id="tile" aria-hidden="true"></div>
    </header>

    <section class="gallery" id="gallery" aria-label="Screenshots" data-i18n-aria="project.shots"></section>

    <section class="about">
      <div class="desc">
        <div class="label" data-i18n="project.about">About the project</div>
        <div id="desc"></div>
      </div>
      <aside>
        <dl class="facts" id="facts"></dl>
        <div class="label" data-i18n="project.highlights">Highlights</div>
        <ul class="features" id="features" style="margin-top:1.4rem"></ul>
        <div class="actions" style="margin-top:2.6rem">
          <a class="btn" id="visit2" target="_blank" rel="noopener"><span data-i18n="project.open">Open the project</span><span class="arr">↗</span></a>
        </div>
      </aside>
    </section>

    <a class="next" id="next">
      <div class="label" data-i18n="project.next">Next project</div>
      <strong><span id="next-name"></span><em id="next-emoji"></em></strong>
    </a>
  </main>

  <footer>
    <span>© <span id="yr"></span> Ricardo Georgel</span>
    <nav>
      <a href="https://www.linkedin.com/in/rgeorgel/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/rgeorgel/" target="_blank" rel="noopener">Instagram</a>
      <a href="index.html#work" data-i18n="project.allWork">All work</a>
    </nav>
  </footer>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot viewer" data-i18n-aria="project.viewer">
    <img id="lb-img" alt="">
    <button class="prev" aria-label="Previous screenshot" data-i18n-aria="project.prev">←</button>
    <button class="next-shot" aria-label="Next screenshot" data-i18n-aria="project.nextShot">→</button>
    <button class="close" aria-label="Close" data-i18n-aria="project.close">✕</button>
    <div class="count" id="lb-count"></div>
  </div>

  <script>
    const list = window.PROJECTS || [];
    const slug = new URLSearchParams(location.search).get('p');
    const idx = list.findIndex(p => p.slug === slug);
    if (idx < 0) location.replace('index.html#work');
    const p = I18N.project(list[Math.max(idx, 0)]);
    I18N.apply();
    I18N.switcher(document.getElementById('langs'));
    const $ = id => document.getElementById(id);
    const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

    // readable text colour on top of the project colour
    const onColor = hex => {
      const [r, g, b] = hex.match(/\w\w/g).map(h => parseInt(h, 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
      return .2126 * r + .7152 * g + .0722 * b > .4 ? '#0b0b0c' : '#ffffff';
    };

    const root = document.documentElement.style;
    root.setProperty('--accent', p.color);
    root.setProperty('--on-accent', onColor(p.color));

    const host = new URL(p.url).host;
    document.title = `${p.name} · Ricardo Georgel`;
    document.querySelector('meta[name=description]').content = p.tagline;

    $('kicker').textContent = `${String(idx + 1).padStart(2, '0')} / ${String(list.length).padStart(2, '0')} · ${p.category}`;
    $('name').textContent = p.name;
    $('tagline').textContent = p.tagline;
    $('tile').textContent = p.emoji;
    $('visit-label').textContent = I18N.t('project.visit', { name: p.name });
    $('host').textContent = host;
    $('visit').href = $('visit2').href = p.url;
    $('yr').textContent = new Date().getFullYear();

    p.description.forEach(t => $('desc').append(el('p', { textContent: t })));
    p.facts.forEach(([k, v]) => $('facts').append(el('div', {}, el('dt', { textContent: k }), el('dd', { textContent: v }))));
    p.features.forEach(f => $('features').append(el('li', { textContent: f })));

    // gallery: first desktop shot full width when there is more than one desktop shot
    const desktop = p.shots.filter(s => !s.mobile).length;
    p.shots.forEach((s, i) => {
      const img = el('img', { src: `projects/${s.src}`, alt: s.alt, loading: i ? 'lazy' : 'eager', decoding: 'async' });
      const fig = el('figure', { className: 'shot reveal' + (s.mobile ? ' phone' : '') });
      if (!s.mobile) {
        fig.append(el('div', { className: 'bar' }, el('i'), el('i'), el('i'), el('span', { textContent: host })));
        if (i === 0 && desktop > 1) fig.classList.add('wide');
      }
      fig.append(img);
      fig.tabIndex = 0;
      fig.addEventListener('click', () => openLb(i));
      fig.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); } });
      $('gallery').append(fig);
    });

    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: 0.1 });
    document.querySelectorAll('.shot.reveal').forEach((s, i) => { s.style.transitionDelay = (i % 3) * 90 + 'ms'; io.observe(s); });

    // next project
    const n = list[(idx + 1) % list.length];
    $('next').href = `project.html?p=${n.slug}`;
    $('next').style.setProperty('--next', n.color);
    $('next').style.setProperty('--next-on', onColor(n.color));
    $('next-name').textContent = n.name;
    $('next-emoji').textContent = n.emoji;

    // lightbox
    const lb = $('lb'), lbImg = $('lb-img');
    let cur = 0, lastFocus = null;
    function show(i) {
      cur = (i + p.shots.length) % p.shots.length;
      lbImg.src = `projects/${p.shots[cur].src}`;
      lbImg.alt = p.shots[cur].alt;
      $('lb-count').textContent = `${cur + 1} / ${p.shots.length}`;
    }
    function openLb(i) { lastFocus = document.activeElement; show(i); lb.classList.add('on'); lb.querySelector('.close').focus(); }
    function closeLb() { lb.classList.remove('on'); lastFocus && lastFocus.focus(); }
    lb.addEventListener('click', e => { if (e.target === lb || e.target === lbImg || e.target.classList.contains('close')) closeLb(); });
    lb.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
    lb.querySelector('.next-shot').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
    const single = p.shots.length < 2;
    lb.querySelector('.prev').hidden = lb.querySelector('.next-shot').hidden = single;
    addEventListener('keydown', e => {
      if (!lb.classList.contains('on')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
    });

    gtag('event', 'view_project', { project: p.slug, language: I18N.lang });
    ['visit', 'visit2'].forEach(id => $(id).addEventListener('click', () => gtag('event', 'visit_project', { project: p.slug })));
  </script>
</body>
</html>
