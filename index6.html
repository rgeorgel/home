  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-a: #2a22c9;
      --bg-b: #0d0a4a;
      --font: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    }
    @property --bg-a { syntax: '<color>'; inherits: true; initial-value: #2a22c9; }
    @property --bg-b { syntax: '<color>'; inherits: true; initial-value: #0d0a4a; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      color: #fff;
      background: radial-gradient(120% 90% at 50% 40%, var(--bg-a) 0%, var(--bg-b) 100%);
      transition: --bg-a 1s ease, --bg-b 1s ease;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    a { color: inherit; text-decoration: none; }

    /* soft grain of dots drifting behind the ring */
    body::before {
      content: ''; position: fixed; inset: -50%;
      background-image: radial-gradient(circle, rgba(255,255,255,.16) 1px, transparent 1.5px);
      background-size: 34px 34px;
      animation: drift 60s linear infinite;
      mask-image: radial-gradient(closest-side, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(closest-side, #000 20%, transparent 75%);
      pointer-events: none;
    }
    @keyframes drift { to { transform: translate(34px, 68px) rotate(4deg); } }

    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #stage.dragging { cursor: grabbing; }
    #stage.link { cursor: pointer; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1.2rem clamp(1rem, 3.5vw, 2.5rem);
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    .brand { font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.25rem); letter-spacing: -.02em; display: flex; align-items: center; gap: .55rem; }
    .brand i {
      width: 1.6em; height: 1.6em; border-radius: 50%;
      background: conic-gradient(from 0deg, #fff, rgba(255,255,255,.15), #fff);
      animation: spin 6s linear infinite;
      -webkit-mask: radial-gradient(circle, transparent 42%, #000 44%); mask: radial-gradient(circle, transparent 42%, #000 44%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .social { display: flex; gap: .5rem; }
    .pill {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1rem; border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-size: .82rem; font-weight: 500;
      transition: background .25s, transform .35s cubic-bezier(.2,1.6,.3,1), color .25s;
    }
    .pill:hover { background: #fff; color: #17124f; transform: translateY(-2px) scale(1.04); }

    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; gap: .9rem;
      padding: 0 1rem clamp(1rem, 3.5vh, 2.2rem);
      pointer-events: none;
    }
    .dock > * { pointer-events: auto; }
    .cta {
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 1.5rem; border-radius: 999px;
      background: #fff; color: #17124f;
      font-weight: 800; font-size: clamp(.9rem, 1.3vw, 1.05rem); letter-spacing: -.01em;
      box-shadow: 0 14px 40px -12px rgba(0,0,0,.55);
      transition: transform .35s cubic-bezier(.2,1.6,.3,1);
      border: 0; cursor: pointer; font-family: inherit;
    }
    .cta:hover { transform: scale(1.06) rotate(-1.5deg); }
    .cta .arr { display: inline-block; transition: transform .3s; }
    .cta:hover .arr { transform: translate(3px,-3px); }
    .cta.swap { animation: pop .45s cubic-bezier(.2,1.6,.3,1); }
    @keyframes pop { 0% { transform: scale(.8); opacity: .3; } 100% { transform: none; opacity: 1; } }

    .nav { display: flex; align-items: center; gap: .9rem; }
    .nav button.step {
      width: 2.4rem; height: 2.4rem; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12);
      color: #fff; font-size: 1rem; cursor: pointer; font-family: inherit;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: background .25s, color .25s, transform .3s cubic-bezier(.2,1.6,.3,1);
    }
    .nav button.step:hover { background: #fff; color: #17124f; transform: scale(1.1); }
    .dots { display: flex; gap: .45rem; }
    .dots button {
      width: .5rem; height: .5rem; border-radius: 999px; border: 0; padding: 0;
      background: rgba(255,255,255,.35); cursor: pointer;
      transition: width .4s cubic-bezier(.2,1,.3,1), background .3s;
    }
    .dots button.on { width: 1.7rem; background: #fff; }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    #loader {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #17124f; transition: opacity .6s, visibility .6s;
      font-weight: 800; font-size: 1.1rem; letter-spacing: .02em;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    #loader span { animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

    @media (max-width: 560px) { .pill span { display: none; } }

<body>

  <script type="module">
    import * as THREE from 'three';

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const CARDS = [
      { intro: true, title: 'Ricardo\nGeorgel', cat: 'Hello, I’m', desc: 'I build small, useful things for the web. Drag, scroll or use ← → to look around.', emoji: '👋', a: '#5a4dff', b: '#2a1fd6', ink: '#fff' },
      { title: 'Causify', cat: 'Legal', desc: 'Practice management for law firms — cases, deadlines, billing and a client portal.', emoji: '⚖️', href: 'https://causify.com.br/home-verde.html', a: '#2fbf7a', b: '#0f6b4f', ink: '#fff' },
      { title: 'Contratos', cat: 'E-signature', desc: 'From template to signed PDF — send contracts by e-mail, WhatsApp or SMS.', emoji: '✍️', href: 'https://contratos-teste.georgel.ca', a: '#4d8dff', b: '#1d3fae', ink: '#fff' },
      { title: 'Portfolio\nBalancer', cat: 'Finance', desc: 'Track and rebalance investments to stay aligned with your target allocation.', emoji: '📈', href: 'https://portfolio-balance.georgel.ca/', a: '#12c9a0', b: '#00806a', ink: '#fff' },
      { title: 'What\nto Eat', cat: 'Food', desc: 'Discover restaurants in Toronto & Vancouver when you can’t decide.', emoji: '🍜', href: 'https://what-to-eat.georgel.ca/', a: '#ff8a4d', b: '#e2452b', ink: '#fff' },
      { title: 'JSON\nFormatter', cat: 'Tools', desc: 'Paste raw JSON — get it formatted and validated instantly.', emoji: '🗂️', href: 'https://formatter.georgel.ca/', a: '#a07bff', b: '#5a2bd6', ink: '#fff' },
      { title: 'URL\nShortener', cat: 'Tools', desc: 'Turn long URLs into clean, shareable links.', emoji: '🔗', href: 'https://url.georgel.ca/', a: '#ffd23d', b: '#ffa200', ink: '#2a1a00' },
      { title: 'Circus\nRunner', cat: 'Game', desc: 'A fast-paced browser game — dodge obstacles and run as far as you can.', emoji: '🎪', href: 'https://circus.georgel.ca/', a: '#ff6aa8', b: '#d81f6a', ink: '#fff' },
    ];
    const N = CARDS.length, STEP = (Math.PI * 2) / N, ARC = Math.min(THREE.MathUtils.degToRad(52), STEP * 0.87), R = 5;

    /* ───────── card artwork (canvas → texture) ───────── */
    const FONT = '"Bricolage Grotesque", system-ui, sans-serif';
    function wrap(g, text, maxW) {
      const out = []; let line = '';
      for (const w of text.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      }
      if (line) out.push(line);
      return out;
    }
    function drawCard(card, i, portrait) {
      const W = portrait ? 1000 : 1500, H = portrait ? 1250 : 900;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      const rad = 70;
      g.beginPath(); g.roundRect(0, 0, W, H, rad); g.clip();

      const grad = g.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, card.a); grad.addColorStop(1, card.b);
      g.fillStyle = grad; g.fillRect(0, 0, W, H);

      // decorative blobs
      g.globalAlpha = .16; g.fillStyle = '#fff';
      g.beginPath(); g.arc(W * (portrait ? .5 : .76), H * (portrait ? .26 : .46), (portrait ? W * .42 : H * .44), 0, 7); g.fill();
      g.globalAlpha = .1;
      g.beginPath(); g.arc(W * .06, H * 1.02, H * .34, 0, 7); g.fill();
      g.globalAlpha = 1;

      // emoji
      const es = portrait ? 380 : 400;
      g.save();
      g.translate(W * (portrait ? .5 : .76), H * (portrait ? .27 : .47));
      g.rotate(-.12);
      g.font = `${es}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 50; g.shadowOffsetY = 30;
      g.fillText(card.emoji, 0, 20);
      g.restore();

      const x = portrait ? 80 : 100;
      const maxW = portrait ? W - 160 : W * .5;
      let y = portrait ? H * .53 : 150;

      // category pill
      g.font = `500 34px ${FONT}`;
      const label = card.cat.toUpperCase();
      g.letterSpacing = '4px';
      const lw = g.measureText(label).width + 56;
      g.fillStyle = card.ink === '#fff' ? 'rgba(255,255,255,.2)' : 'rgba(0,0,0,.12)';
      g.beginPath(); g.roundRect(x, y - 44, lw, 68, 34); g.fill();
      g.fillStyle = card.ink; g.textBaseline = 'middle'; g.textAlign = 'left';
      g.fillText(label, x + 28, y - 8);
      g.letterSpacing = '0px';

      // index
      g.font = `500 34px ${FONT}`; g.textAlign = 'right'; g.globalAlpha = .7;
      g.fillText(String(i + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0'), W - x, portrait ? 100 : y - 8);
      g.globalAlpha = 1; g.textAlign = 'left';

      // title
      const ts = portrait ? 150 : 172;
      g.font = `800 ${ts}px ${FONT}`; g.textBaseline = 'alphabetic';
      g.letterSpacing = '-5px';
      y += 70 + ts * .78;
      for (const line of card.title.split('\n')) { g.fillText(line, x - 6, y); y += ts * .92; }
      g.letterSpacing = '0px';

      // description
      g.font = `500 ${portrait ? 44 : 42}px ${FONT}`; g.globalAlpha = .88;
      y += -ts * .92 + 90;
      for (const line of wrap(g, card.desc, maxW)) { g.fillText(line, x, y); y += portrait ? 60 : 58; }
      g.globalAlpha = 1;

      // hint
      g.font = `800 38px ${FONT}`;
      g.fillText(card.intro ? 'Drag to spin  ⟷' : 'Click to open  ↗', x, H - 90);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; tex.offset.x = 1;   // un-mirror: we look at the inside of the cylinder
      tex.anisotropy = 8;
      return tex;
    }

    /* ───────── scene ───────── */
    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);
    const CAM_Z = 1.2;
    camera.position.set(0, 0, CAM_Z);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x3a2fd0, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 5, 4); scene.add(key);

    const ring = new THREE.Group(); scene.add(ring);
    let panels = [], portrait = null;

    function buildPanels() {
      const p = innerWidth / innerHeight < 0.85;
      if (p === portrait) return;
      portrait = p;
      panels.forEach(m => { ring.remove(m); m.geometry.dispose(); m.material.map.dispose(); m.material.dispose(); });
      const H = R * ARC * (portrait ? 1.25 : 0.6);
      panels = CARDS.map((card, i) => {
        const geo = new THREE.CylinderGeometry(R, R, H, 40, 1, true, Math.PI - ARC / 2, ARC);
        const mat = new THREE.MeshBasicMaterial({ map: drawCard(card, i, portrait), side: THREE.BackSide, transparent: true });
        const m = new THREE.Mesh(geo, mat);
        m.rotation.y = -i * STEP;
        m.userData.i = i;
        ring.add(m);
        return m;
      });
      panelH = H;
    }
    let panelH = 3;

    /* floating clay shapes */
    const clay = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .5, metalness: 0 });
    const floaters = [
      [new THREE.TorusGeometry(.42, .17, 24, 60), [-3.1, 1.5, -3.2]],
      [new THREE.SphereGeometry(.34, 40, 30), [3.0, 1.6, -3.6]],
      [new THREE.ConeGeometry(.36, .7, 40), [3.2, -1.5, -3.0]],
      [new THREE.CapsuleGeometry(.2, .5, 12, 30), [-3.0, -1.6, -3.8]],
      [new THREE.IcosahedronGeometry(.3, 0), [-1.5, 2.1, -4.6]],
      [new THREE.TorusKnotGeometry(.24, .09, 100, 16), [1.6, -2.1, -4.4]],
      [new THREE.SphereGeometry(.16, 30, 20), [-2.0, -.2, -2.4]],
      [new THREE.BoxGeometry(.38, .38, .38), [2.2, .3, -2.2]],
    ].map(([geo, pos], i) => {
      const m = new THREE.Mesh(geo, clay.clone());
      m.userData = { base: new THREE.Vector3(...pos), ph: i * 1.7, sp: .5 + (i % 3) * .2 };
      m.position.copy(m.userData.base);
      scene.add(m);
      return m;
    });

    function layout() {
      const w = innerWidth, h = innerHeight, aspect = w / h;
      renderer.setSize(w, h, false);
      buildPanels();
      const dist = R + CAM_Z;
      const needW = R * ARC * 1.22, needH = panelH * (portrait ? 1.5 : 1.75);
      const visH = Math.max(needH, needW / aspect);
      camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(visH / 2 / dist));
      camera.aspect = aspect; camera.updateProjectionMatrix();
      const spread = Math.min(1, (visH * aspect) / 7.5);
      floaters.forEach(f => f.userData.spread = spread);
    }

    /* ───────── state ───────── */
    let pos = -1.6, target = 0, vel = 0, active = -1;
    let dragging = false, moved = 0, lastX = 0, dragVel = 0;
    const mod = n => ((n % N) + N) % N;
    const go = n => { target = n; };

    const dotsEl = document.getElementById('dots');
    const dots = CARDS.map((c, i) => {
      const b = document.createElement('button');
      b.setAttribute('aria-label', c.title.replace('\n', ' '));
      b.onclick = () => { const cur = Math.round(target); let d = i - mod(cur); if (d > N / 2) d -= N; if (d < -N / 2) d += N; go(cur + d); };
      dotsEl.appendChild(b); return b;
    });
    const cta = document.getElementById('cta'), ctaLabel = document.getElementById('cta-label');
    const mix = (hex, k) => '#' + new THREE.Color(hex).lerp(new THREE.Color(0x07061f), k).getHexString();

    function setActive(i) {
      if (i === active) return;
      active = i;
      const c = CARDS[i];
      dots.forEach((d, j) => d.classList.toggle('on', j === i));
      document.body.style.setProperty('--bg-a', mix(c.b, .25));
      document.body.style.setProperty('--bg-b', mix(c.b, .82));
      if (c.intro) { cta.href = '#'; cta.removeAttribute('target'); ctaLabel.textContent = 'Explore projects'; cta.querySelector('.arr').textContent = '→'; }
      else { cta.href = c.href; cta.target = '_blank'; cta.rel = 'noopener'; ctaLabel.textContent = 'Open ' + c.title.replace('\n', ' '); cta.querySelector('.arr').textContent = '↗'; }
      cta.classList.remove('swap'); void cta.offsetWidth; cta.classList.add('swap');
      floatTarget.set(c.a).lerp(new THREE.Color(0xffffff), .45);
    }
    const floatTarget = new THREE.Color(0xffffff);
    cta.addEventListener('click', e => { if (CARDS[active].intro) { e.preventDefault(); go(Math.round(target) + 1); } });
    document.getElementById('home').onclick = e => { e.preventDefault(); const cur = Math.round(target); let d = -mod(cur); if (d < -N / 2) d += N; go(cur + d); };
    document.getElementById('prev').onclick = () => go(Math.round(target) - 1);
    document.getElementById('next').onclick = () => go(Math.round(target) + 1);
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(Math.round(target) + 1);
      if (e.key === 'ArrowLeft') go(Math.round(target) - 1);
    });

    /* drag */
    const pxPerPanel = () => Math.max(260, innerWidth * 0.5);
    canvas.addEventListener('pointerdown', e => {
      dragging = true; moved = 0; lastX = e.clientX; dragVel = 0;
      canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', e => {
      pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      const d = -dx / pxPerPanel();
      pos += d; target = pos; dragVel = d;
    });
    const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2(0, 0);
    function hit() { raycaster.setFromCamera(pointer, camera); const h = raycaster.intersectObjects(panels)[0]; return h ? h.object.userData.i : -1; }
    function endDrag(e) {
      if (!dragging) return;
      dragging = false; canvas.classList.remove('dragging');
      if (moved < 6) {                                    // it was a click
        const i = hit();
        if (i === active) { const c = CARDS[i]; if (c.href) window.open(c.href, '_blank', 'noopener'); else go(Math.round(pos) + 1); }
        else if (i >= 0) { let d = i - mod(Math.round(pos)); if (d > N / 2) d -= N; if (d < -N / 2) d += N; go(Math.round(pos) + d); }
        else target = Math.round(pos);
      } else {
        target = Math.round(pos + THREE.MathUtils.clamp(dragVel * 14, -1, 1));
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* wheel / trackpad */
    let wheelAcc = 0, wheelLock = 0;
    addEventListener('wheel', e => {
      e.preventDefault();
      const now = performance.now();
      if (now < wheelLock) return;
      wheelAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(wheelAcc) > 40) { go(Math.round(target) + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 420; }
    }, { passive: false });

    addEventListener('resize', layout);

    /* ───────── loop ───────── */
    const clock = new THREE.Clock();
    const dim = new THREE.Color(), white = new THREE.Color(0xffffff), shade = new THREE.Color(0x5560b8);
    const camLook = new THREE.Vector2();
    function frame() {
      requestAnimationFrame(frame);
      const t = clock.getElapsedTime();

      if (!dragging) {                       // spring towards target
        const prev = pos;
        vel += (target - pos) * 0.045; vel *= 0.78; pos += vel;
        if (Math.abs(target - pos) < 0.0004 && Math.abs(vel) < 0.0004) { pos = target; vel = 0; }
        dragVel = pos - prev;
      }
      ring.rotation.y = pos * STEP;
      ring.position.y = reduced ? 0 : Math.sin(t * .8) * .05;
      ring.rotation.z = THREE.MathUtils.clamp(-dragVel * 1.2, -.08, .08);
      setActive(mod(Math.round(pos)));

      panels.forEach((m, i) => {
        let d = Math.abs(i - pos) % N; if (d > N / 2) d = N - d;
        m.material.color.copy(dim.copy(white).lerp(shade, Math.min(d, 1) * .55));
      });

      // parallax
      camLook.x += (pointer.x - camLook.x) * .05; camLook.y += (pointer.y - camLook.y) * .05;
      camera.position.x = camLook.x * .22; camera.position.y = camLook.y * .14;
      camera.lookAt(0, 0, -R);

      floaters.forEach((f, i) => {
        const u = f.userData;
        f.position.set(
          u.base.x * u.spread + Math.sin(t * .5 + u.ph) * .12 - dragVel * 6 * (1 + i % 3),
          u.base.y + (reduced ? 0 : Math.sin(t * u.sp + u.ph) * .18),
          u.base.z
        );
        f.rotation.x = t * .3 * u.sp + u.ph; f.rotation.y = t * .4 * u.sp + pos * 1.5;
        f.material.color.lerp(floatTarget, .04);
      });

      canvas.classList.toggle('link', !dragging && hit() >= 0);
      renderer.render(scene, camera);
    }

    (async () => {
      try { await Promise.all([document.fonts.load(`800 100px ${FONT}`), document.fonts.load(`500 40px ${FONT}`)]); } catch (e) {}
      layout();
      if (reduced) pos = 0;
      frame();
      document.getElementById('loader').classList.add('done');
    })();
  </script>
</body>
</html>
